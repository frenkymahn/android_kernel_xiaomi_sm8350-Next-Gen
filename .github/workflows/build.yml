name: Build Xiaomi 11T Pro Next-Gen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gnupg gperf \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip libssl-dev libelf-dev tar wget

      - name: Download Official AOSP Clang
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12L-release clang-repo
          mkdir -p clang
          cp -r clang-repo/clang-r416183b1/* clang/ || cp -r clang-repo/clang-r*/* clang/
          rm -rf clang-repo

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Configure and Build Kernel (Image, DTBs, DTBOs)
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out

          # 1. Base config merge
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/lahaina-qgki_defconfig \
            arch/arm64/configs/vendor/vili_QGKI.config

          # Set Custom LocalVersion Name to -Next-Gen
          scripts/config --file out/.config --set-str LOCALVERSION "-Next-Gen"

          # 2. Defconfig sync
          make O=out ARCH=arm64 CC=clang olddefconfig

          # 3. Compile Kernel Image and all Device Trees
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image dtbs

      - name: Package Kernel with AnyKernel3 (HyperOS Compatible)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3

          # Setup device info
          sed -i 's/do.devicecheck=1/do.devicecheck=1/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=vili/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=Xiaomi 11T Pro/g' AnyKernel3/anykernel.sh

          # Target boot and dtbo partitions
          sed -i 's/is_slot_device=0;/is_slot_device=0;\nblock=\/dev\/block\/bootdevice\/by-name\/boot;/g' AnyKernel3/anykernel.sh

          # 1. Copy Kernel Image
          cp out/arch/arm64/boot/Image AnyKernel3/

          # 2. Merge Device Tree Blobs (dtb)
          find out/ -name "*.dtb" -not -name ".*" -exec cat {} + > AnyKernel3/dtb

          # 3. Build Fresh dtbo.img from compiled DTBO files
          curl -sSL "https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-20.0/utils/src/mkdtboimg.py" -o mkdtboimg.py
          
          # Find all compiled dtbo files across the build output
          DTBO_FILES=$(find out/ -name "*.dtbo" -not -name ".*" | sort)
          
          if [ -n "$DTBO_FILES" ]; then
            echo "Creating dtbo.img from found overlays..."
            python3 mkdtboimg.py create AnyKernel3/dtbo.img $DTBO_FILES
          elif [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          else
            echo "Direct dtbo not found, extracting overlays from dtb target..."
            python3 mkdtboimg.py create AnyKernel3/dtbo.img $(find out/arch/arm64/boot/dts/vendor/qcom/ -name "*vili*.dtb" 2>/dev/null || find out/ -name "*sm8350*.dtb")
          fi

          # 4. Pack flashable zip
          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-NextGen-Kernel.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-NextGen-Kernel
          path: Xiaomi-11T-Pro-NextGen-Kernel.zip
