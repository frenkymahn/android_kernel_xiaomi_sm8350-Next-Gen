name: Build Xiaomi 11T Pro Next-Gen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libssl-dev libelf-dev python3 zip libncurses5-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lld llvm

      - name: Download Official AOSP Clang
        run: |
          mkdir -p clang
          cd clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release .
          cd ..

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Configure and Build Kernel
        run: |
          export PATH="$(pwd)/clang/clang-r416183b/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # 1. Base QGKI defconfig
          make O=out ARCH=arm64 CC=clang LD=ld.lld vendor/lahaina-qgki_defconfig

          # 2. Merge Xiaomi & Vili QGKI configs
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/lahaina_QGKI.config \
            arch/arm64/configs/vendor/xiaomi_QGKI.config \
            arch/arm64/configs/vendor/vili_QGKI.config

          # 3. Finalize config
          make O=out ARCH=arm64 CC=clang LD=ld.lld olddefconfig

          # 4. Compile Image and DTBs (dtbo.img target removed from make)
          make -j$(nproc --all) ARCH=arm64 CC=clang LD=ld.lld KCFLAGS="-w" Image dtbs O=out

      - name: Package Kernel with AnyKernel3
        run: |
          # 1. Clone AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # 2. Copy compiled Image and concatenate DTBs
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          find out/arch/arm64/boot/dts/vendor/qcom -name "*.dtb" -exec cat {} + > AnyKernel3/dtb

          # 3. Generate dtbo.img if dtbo files exist
          if [ -f scripts/dtc/libfdt/mkdtboimg.py ]; then
            python3 scripts/dtc/libfdt/mkdtboimg.py create AnyKernel3/dtbo.img $(find out/arch/arm64/boot/dts/vendor/qcom -name "*.dtbo") || true
          fi

          # 4. Create anykernel.sh for HyperOS / MIUI
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ## Xiaomi 11T Pro (vili) - HyperOS / MIUI Flash

          properties() { '
          kernel.string=NextGen Kernel for Xiaomi 11T Pro (vili)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=Xiaomi 11T Pro
          device.name2=milahaina
          device.name3=vili
          device.name4=vili_in
          supported.versions=11.0-17.0
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh && passthrough;

          # Flash DTBO if present
          if [ -f dtbo.img ]; then
            flash_dtbo;
          fi

          dump_boot;
          write_boot;
          EOF

          # 5. Create flashable zip package
          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-NextGen-HyperOS-Kernel.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-HyperOS-Kernel-Zip
          path: Xiaomi-11T-Pro-NextGen-HyperOS-Kernel.zip
