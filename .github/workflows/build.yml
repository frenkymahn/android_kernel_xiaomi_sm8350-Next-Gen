name: Build Xiaomi 11T Pro Next-Gen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex \
            libelf-dev libfl-dev git curl wget zip unzip python3 python-is-python3 libarchive-tools \
            device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Download AOSP Clang
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release clang-repo
          mkdir -p clang
          cp -r clang-repo/clang-r416183b/* clang/ || cp -r clang-repo/clang-r*/* clang/
          rm -rf clang-repo

      - name: Configure Kernel & Inject eBPF
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          mkdir -p out
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/lahaina-qgki_defconfig \
            arch/arm64/configs/vendor/vili_QGKI.config

          # eBPF Support Injections for Android Next-Gen / HyperOS
          cat << 'EOF' >> out/.config
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_CGROUP_BPF=y
          EOF

      - name: Compile Kernel, DTB and DTBO
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # 1. Compile Kernel Image, DTBs and official DTBO Image
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image dtbs dtbo.img || make -j$(nproc --all) O=out CC=clang LD=ld.lld Image dtbs

      - name: Package Kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3

          # 1. Copy Kernel Image
          cp out/arch/arm64/boot/Image AnyKernel3/Image

          # 2. Concat clean Lahaina DTBs into single dtb (Proper 2-3 MB size)
          find out/arch/arm64/boot/dts/vendor/qcom/ -name "lahaina*.dtb" -exec cat {} + > AnyKernel3/dtb

          # 3. Locate and copy dtbo.img
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          else
            # Fallback search for compiled dtbo.img in output directory
            find out/ -name "dtbo.img" -exec cp {} AnyKernel3/dtbo.img \;
          fi

          # 4. Check folder contents
          ls -lh AnyKernel3/

          # 5. Write AnyKernel3 Flash Script
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=NextGen Kernel for Xiaomi 11T Pro (vili)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=Xiaomi 11T Pro
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # Load functions
          . tools/ak3-core.sh;

          # 1. Boot Partition Flash (Kernel + Concatenated DTB)
          BLOCK=boot;
          is_slot_device=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          split_boot;
          flash_boot;
          ## end boot install

          # 2. DTBO Partition Flash (Screen & Touch Overlay)
          if [ -f dtbo.img ]; then
            BLOCK=dtbo;
            is_slot_device=auto;
            reset_ak;
            flash_boot;
          fi;
          ## end dtbo install

          # 3. Vendor Boot Partition
          BLOCK=vendor_boot;
          is_slot_device=auto;

          reset_ak;
          split_boot;
          flash_boot;
          ## end vendor_boot install
          EOF

          # 6. Make Flashable Zip
          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-NextGen-Kernel.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-NextGen-Kernel
          path: Xiaomi-11T-Pro-NextGen-Kernel.zip
