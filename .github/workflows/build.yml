name: Build Xiaomi 11T Pro Next-Gen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg gperf \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip libssl-dev libelf-dev tar wget binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Download Official AOSP Clang r15
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android14-release clang-repo
          mkdir -p clang
          cp -r clang-repo/clang-r450784d/* clang/
          rm -rf clang-repo

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Configure and Build Kernel (Image, DTBs, DTBOs)
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out ARCH=arm64 CC=clang HOSTCC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/lahaina-qgki_defconfig vendor/vili_QGKI.config

          make -j$(nproc --all) O=out ARCH=arm64 CC=clang HOSTCC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image dtbs dtbo.img || make -j$(nproc --all) O=out ARCH=arm64 CC=clang HOSTCC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image dtbs

      - name: Package Kernel with AnyKernel3 (HyperOS Compatible)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3

          # Configure AnyKernel3 for vili
          sed -i 's/do.devicecheck=1/do.devicecheck=1/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=vili/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=Xiaomi 11T Pro/g' AnyKernel3/anykernel.sh

          # 1. Copy Kernel Image
          cp out/arch/arm64/boot/Image AnyKernel3/

          # 2. Merge Device Tree Blobs (dtb)
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > AnyKernel3/dtb

          # 3. Handle dtbo.img directly
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          elif find out/ -name "dtbo.img" | grep -q dtbo.img; then
            cp $(find out/ -name "dtbo.img" | head -n 1) AnyKernel3/
          else
            curl -sSL "https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-20.0/utils/src/mkdtboimg.py" -o mkdtboimg.py
            python3 mkdtboimg.py create AnyKernel3/dtbo.img $(find out/arch/arm64/boot/dts/ -name "*.dtbo")
          fi

          # 4. Pack flashable zip
          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-NextGen-Kernel.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-NextGen-Kernel
          path: Xiaomi-11T-Pro-NextGen-Kernel.zip
