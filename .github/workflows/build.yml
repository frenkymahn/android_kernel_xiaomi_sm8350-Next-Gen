name: Build Xiaomi 11T Pro Next-Gen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex \
            libelf-dev libfl-dev git curl wget zip unzip python3 python-is-python3 libarchive-tools \
            device-tree-compiler

      - name: Download AOSP Clang
        run: |
          git clone --depth=1 https://gitlab.com/ElectroPerf/prebuilts_clang_host_linux-x86_clang-r487747c.git clang

      - name: Configure Kernel (Merged defconfigs)
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          mkdir -p out
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/lahaina-qgki_defconfig \
            arch/arm64/configs/vendor/vili_QGKI.config

      - name: Compile Kernel, DTB and DTBO
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # 1. Compile Kernel Image & All Device Tree Blobs
          make -j$(nproc --all) O=out CC=clang Image dtbs

          # 2. Concat Lahaina/Vili DTBs into single dtb
          find out/arch/arm64/boot/dts/vendor/qcom/ -name "*lahaina*.dtb" -exec cat {} + > out/arch/arm64/boot/dtb

          # 3. Create dtbo.img using mkdtboimg
          if [ -f scripts/dtc/libfdt/mkdtboimg.py ]; then
            python3 scripts/dtc/libfdt/mkdtboimg.py create out/arch/arm64/boot/dtbo.img $(find out/arch/arm64/boot/dts/ -name "*vili*.dtbo" -o -name "*overlay*.dtbo")
          elif [ -f scripts/mkdtboimg.py ]; then
            python3 scripts/mkdtboimg.py create out/arch/arm64/boot/dtbo.img $(find out/arch/arm64/boot/dts/ -name "*vili*.dtbo" -o -name "*overlay*.dtbo")
          else
            curl -sSL "https://android.googlesource.com/platform/system/libufdt/+archive/master/utils/src.tar.gz" | tar -xz
            python3 mkdtboimg.py create out/arch/arm64/boot/dtbo.img $(find out/arch/arm64/boot/dts/ -name "*vili*.dtbo" -o -name "*overlay*.dtbo")
          fi

      - name: Package Kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3

          # 1. Copy Image, DTB and DTBO
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp out/arch/arm64/boot/dtb AnyKernel3/
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          # 2. Write AnyKernel3 Script
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=NextGen Kernel for Xiaomi 11T Pro (vili)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=Xiaomi 11T Pro
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # Load functions
          . tools/ak3-core.sh;

          # 1. Boot Partition Flash
          BLOCK=boot;
          is_slot_device=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          split_boot;
          flash_boot;
          ## end boot install

          # 2. DTBO Partition Flash
          BLOCK=dtbo;
          is_slot_device=auto;

          reset_ak;
          if [ -f dtbo.img ]; then
            flash_boot;
          fi;
          ## end dtbo install

          # 3. Vendor Boot Partition Patch/Preserve
          BLOCK=vendor_boot;
          is_slot_device=auto;

          reset_ak;
          split_boot;
          flash_boot;
          ## end vendor_boot install
          EOF

          # 3. Make flashable zip
          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-NextGen-Kernel.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-NextGen-Kernel
          path: Xiaomi-11T-Pro-NextGen-Kernel.zip
